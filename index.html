<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Cards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">


    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- CLOUD ICONs -->

    <i class="fa-solid fa-cloud cloud-icon1"></i>
    <i class="fa-solid fa-cloud cloud-icon2"></i>
    <i class="fa-solid fa-cloud cloud-icon3"></i>
    <i class="fa-solid fa-cloud cloud-icon4"></i>
    <i class="fa-solid fa-cloud cloud-icon5"></i>

    <!-- WEATHER CARD 1 -->


    <div class="weather-card1">

        <input class="search-bar1" type="text" placeholder="SEARCH">

        <i class="fa-solid fa-magnifying-glass search-icon1"></i>

        <img class="sun-img" src="./assets/sun-img.png" alt="sun-img">

        <p class="weather-temp1">
            47°C
        </p>

        <p class="weather-location1">
            Lahore, Pakistan
        </p>

        <img class="humidity-img1" src="./assets/humidity-img1.png" alt="humidity-img">

        <p class="humidity-temp1">
            48%
            <br>
            Humidity
        </p>

        <img class="wind-img1" src="./assets/wind-img1.png" alt="wind-img">
    </div>


    <!-- WEATHER CARD 2 -->


    <div class="weather-card2">

        <input class="search-bar2" type="text" placeholder="SEARCH">

        <i class="fa-solid fa-magnifying-glass search-icon2"></i>

        <img class="moon-img" src="./assets/moon-img.png" alt="moon-img">


        <p class="weather-temp2">
            17°C
        </p>

        <p class="weather-location2">
            Islamabad, Pakistan
        </p>

        <p class="humidity-temp2">
            48%
            <br>
            Humidity
        </p>

        <img class="wind-img2" src="./assets/wind-img1.png" alt="wind-img">
        <p class="wind-time wind-time2">
            11.02
        </p>

        <p class="wind-speed wind-speed2">
            Wind Speed
        </p>
    </div>


    <!-- WEATHER CARD 3 -->


    <div class="weather-card3">

        <input class="search-bar3" type="text" placeholder="SEARCH">

        <i class="fa-solid fa-magnifying-glass search-icon3"></i>

        <img class="cloudy-sun-img" src="./assets/cloudy-sun-img.png" alt="cloudy-sun-img">

        <p class="weather-temp3">
            21°C
        </p>

        <p class="weather-location3">
            Karachi, Pakistan
        </p>

        <img class="humidity-img3" src="./assets/humidity-img1.png" alt="humidity-img">
        <p class="humidity-temp3">
            28%
            <br>
            Humidity
        </p>


        <img class="wind-img3" src="./assets/wind-img1.png" alt="wind-img">
        <p class="wind-time wind-time3">
            18.12
        </p>

        <p class="wind-speed wind-speed3">
            Wind Speed
        </p>
    </div>



</body>

</html>
